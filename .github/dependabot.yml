version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      codemirror:
        patterns:
          - "@codemirror/*"
          - "@bhsd/codemirror-wikitext"
      testing:
        patterns:
          - "vitest"
          - "@testing-library/*"
          - "@playwright/test"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
